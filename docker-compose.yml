services:
  ustoz:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ustoz-landing
    image: ustoz-landing:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
      API_BASE_URL: "https://api.global-mentorship.uz"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
